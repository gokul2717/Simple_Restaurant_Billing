<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>Anandha Bavan</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato&display=swap"
    rel="stylesheet">
   <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
</head>
</head>

<style>
  #head{
      font-family: 'Josefin Sans', sans-serif;
    font-size: 20px;
  }

  table th {
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    color: white;
    font-size: 18px;
  }
  table td{
  font-family: 'Josefin Sans', sans-serif;
    font-size: 16px;
}

  h1,
  h2 {
    font-family: 'Playfair Display', serif;
  }
</style>



<body class="bg-dark">
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" id="head">வீட்டு சமையல்</a>
    </div>
  </nav>

  <!-- Hero Section -->
  <header class="bg-warning text-center py-4">
    <h1 class="fw-bold">Veettu Samayal</h1>
    <p class="lead"><b>Come hungry, Leave happy ! </b></p>
  </header>

  <!-- Menu Section -->
  <div class="container bg my-5">
    <div class="container my-0">
      <!-- Back Button -->
      <div class="d-flex justify-content-start ">
        <a href="front.html" class="btn btn-secondary">⬅ Back to Home</a>
      </div>
    </div>

    <h3 class="text-center mb-4">Place your BreakFast Menu</h3>
    <table class="table table-bordered table-hover text-center align-middle">
      <thead class="table-dark">
        <tr >
          <th class="text-warning">Item</th>
          <th class="text-warning">Price (₹)</th>
          <th class="text-warning" >Quantity</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Idly</td>
          <td>12</td>
          <td><input type="number" class="form-control" id="iq" min="0"></td>
        </tr>
        <tr>
          <td>Dosa</td>
          <td>50</td>
          <td><input type="number" class="form-control" min="0" id="dq"></td>
        </tr>
        <tr>
          <td>Ven-Pongal</td>
          <td>60</td>
          <td><input type="number" class="form-control" min="0" id="pq"></td>
        </tr>
        <tr>
          <td>Vada</td>
          <td>10</td>
          <td><input type="number" class="form-control" min="0" id="vq"></td>
        </tr>
        <tr>
          <td>Poori (3)</td>
          <td>50</td>
          <td><input type="number" class="form-control" min="0" id="poq"></td>
        </tr>
        <tr>
          <td>Upma</td>
          <td>40</td>
          <td><input type="number" class="form-control" min="0" id="uq"></td>
        </tr>
        <tr>
          <td>Coffee</td>
          <td>15</td>
          <td><input type="number" class="form-control" min="0" id="cq"></td>
        </tr>
      </tbody>
    </table>

    <div class="text-center mt-3 mb-0">
      <button class="btn btn-primary me-2" onclick="calculateBill()">Calculate</button>
      <button class="btn btn-success" onclick="downloadBill()" id="downloadBtn" disabled>Download Bill</button>
    </div>

    <div class="mt-2 mb-0">
      <h4 id="billOutput" class="text-center text-warning"></h4>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-warning text-dark text-center py-3">
    <p class="mb-0">© 2026 Veettu Samayal | Crafted with ❤️ | Reffered by Copilot</p>
  </footer>

  <script>
    let billNumber = 1;
    let lastBillText = "";

    function calculateBill() {
      const items = [
        { name: "Idly", price: 12, qty: parseInt(document.getElementById("iq").value) || 0 },
        { name: "Dosa", price: 50, qty: parseInt(document.getElementById("dq").value) || 0 },
        { name: "Ven-Pongal", price: 60, qty: parseInt(document.getElementById("pq").value) || 0 },
        { name: "Vada", price: 10, qty: parseInt(document.getElementById("vq").value) || 0 },
        { name: "Poori (3)", price: 50, qty: parseInt(document.getElementById("poq").value) || 0 },
        { name: "Upma", price: 40, qty: parseInt(document.getElementById("uq").value) || 0 },
        { name: "Coffee", price: 15, qty: parseInt(document.getElementById("cq").value) || 0 }
      ];

      let total = 0;
      let billDetails = "Bill No: " + billNumber + "\n";
      billDetails += "Date & Time: " + new Date().toLocaleString() + "\n\n";
      billDetails += "Items Ordered:\n";

      let hasOrder = false;
      items.forEach(item => {
        if (item.qty > 0) {
          let itemTotal = item.price * item.qty;
          total += itemTotal;
          billDetails += `${item.name} x ${item.qty} = ₹${itemTotal}\n`;
          hasOrder = true;
        }
      });

      if (!hasOrder) {
        alert("Please enter quantity for at least one item!");
        return;
      }

      billDetails += "\nGrand Total = ₹" + total;
      document.getElementById("billOutput").innerText = "Grand Total = ₹" + total;
      document.getElementById("downloadBtn").disabled = false;
      lastBillText = billDetails;
    }

    function downloadBill() {
      if (!lastBillText) {
        alert("Please calculate the bill first!");
        return;
      }

      const blob = new Blob([lastBillText], { type: "text/plain" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "Bill_" + billNumber + ".txt";
      link.click();

      billNumber++;
      document.getElementById("downloadBtn").disabled = true;
       // Clear all inputs after download
      const inputs = document.querySelectorAll("input[type='number']");
      inputs.forEach(input => input.value = "");
      document.getElementById("billOutput").innerText = "";
      lastBillText = "";
    }
  </script>
</body>

</html>
